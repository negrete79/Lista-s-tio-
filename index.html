<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2E7D32">
  <title>Sítio Recanto da Limeira — Controle de Suprimentos e Compras</title>
  <link rel="manifest" href="manifest.json">
  <script src="html2pdf.bundle.min.js"></script>
  <script>
    if (typeof html2pdf === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"><\/script>');
    }
  </script>
  <style>
    :root {
      --verde-campo: #2E7D32;
      --verde-escuro: #1B5E20;
      --fundo: #F3F6F4;
      --branco: #FFFFFF;
      --texto: #263238;
      --urgente: #C62828;
      --cinza-claro: #E0E0E0;
      --sombra: 0 4px 6px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--fundo); color: var(--texto); -webkit-tap-highlight-color: transparent; padding-bottom: 90px; }
    header { background-color: var(--verde-campo); color: var(--branco); padding: 16px; text-align: center; box-shadow: var(--sombra); sticky: top; }
    header h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 0.85rem; opacity: 0.9; }
    .status-bar { background: var(--verde-escuro); color: var(--branco); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; }
    .badge-urgencia { padding: 4px 8px; border-radius: 4px; text-transform: uppercase; font-size: 0.75rem; }
    .badge-normal { background-color: #4CAF50; color: white; }
    .badge-urgente { background-color: var(--urgente); color: white; }
    main { padding: 16px; max-width: 600px; margin: 0 auto; }
    .card { background: var(--branco); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--sombra); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--texto); }
    .form-control { width: 100%; padding: 12px; border: 1px solid var(--cinza-claro); border-radius: 8px; font-size: 1rem; outline: none; transition: border 0.2s; }
    .form-control:focus { border-color: var(--verde-campo); }
    .btn { border: none; border-radius: 8px; padding: 12px 16px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s; }
    .btn:active { opacity: 0.8; }
    .btn-primary { background-color: var(--verde-campo); color: var(--branco); }
    .btn-danger { background-color: var(--urgente); color: var(--branco); }
    .btn-secondary { background-color: #78909C; color: var(--branco); }
    .btn-outline { background-color: transparent; border: 2px solid var(--verde-campo); color: var(--verde-campo); }
    .category-group { margin-bottom: 20px; }
    .category-title { font-size: 0.95rem; font-weight: 700; color: var(--verde-escuro); margin-bottom: 8px; border-bottom: 2px solid var(--verde-campo); padding-bottom: 4px; }
    .item-card { background: var(--fundo); border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .item-info { flex: 1; }
    .item-name { font-weight: 600; font-size: 0.95rem; }
    .item-qty { font-size: 0.85rem; color: #546E7A; margin-top: 2px; }
    .item-actions { display: flex; gap: 8px; }
    .action-btn { background: none; border: none; font-size: 1.2rem; padding: 6px; cursor: pointer; border-radius: 4px; }
    .fixed-footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--branco); padding: 12px 16px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); display: flex; gap: 10px; z-index: 100; max-width: 600px; margin: 0 auto; }
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-card { background: var(--branco); width: 100%; max-width: 480px; border-radius: 12px; padding: 20px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; color: var(--verde-escuro); }
    .urgency-selector { display: flex; gap: 10px; margin: 16px 0; }
    .urgency-option { flex: 1; border: 2px solid var(--cinza-claro); padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: 600; }
    .urgency-option.selected-normal { border-color: #4CAF50; background: #E8F5E9; color: #2E7D32; }
    .urgency-option.selected-urgente { border-color: var(--urgente); background: #FFEBEE; color: var(--urgente); }
    #a4-preview-container { background: #525659; padding: 10px; }
    .a4-page { background: white; width: 100%; min-height: 297mm; padding: 15mm 10mm 15mm 10mm; box-shadow: 0 0 10px rgba(0,0,0,0.3); box-sizing: border-box; font-size: 12pt; position: relative; }
    .pdf-header { border-bottom: 2px solid #2E7D32; padding-bottom: 8px; margin-bottom: 12px; }
    .pdf-header h2 { color: #1B5E20; font-size: 14pt; text-align: center; font-weight: bold; }
    .pdf-header p { text-align: center; font-size: 9pt; color: #555; }
    .pdf-meta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 9.5pt; font-weight: bold; background: #f0f0f0; padding: 6px; border-radius: 4px; }
    .pdf-category { margin-top: 12px; page-break-inside: avoid; break-inside: avoid; }
    .pdf-category-title { background: #2E7D32; color: white; padding: 4px 8px; font-weight: bold; font-size: 10pt; }
    .pdf-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .pdf-table th, .pdf-table td { border: 1px solid #ccc; padding: 5px 8px; text-align: left; font-size: 9.5pt; }
    .pdf-table th { background: #e8f5e9; font-weight: bold; }
    .pdf-footer { position: absolute; bottom: 10mm; left: 10mm; right: 10mm; text-align: center; font-size: 8pt; color: #777; border-top: 1px solid #ddd; padding-top: 4px; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #323232; color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <h1>🌿 Sítio Recanto da Limeira</h1>
    <p>Controle de Suprimentos e Compras</p>
  </header>

  <div class="status-bar">
    <span id="display-datetime">📅 --/--/---- --:--</span>
    <span id="display-urgency" class="badge-urgencia badge-normal">🟢 NORMAL</span>
  </div>

  <main>
    <div class="card">
      <form id="add-item-form">
        <div class="form-group">
          <label for="item-name">Nome do item</label>
          <input type="text" id="item-name" class="form-control" placeholder="Ex: Arroz, Detergente..." required>
        </div>
        <div class="form-group">
          <label for="item-qty">Quantidade</label>
          <input type="text" id="item-qty" class="form-control" placeholder="Ex: 2, 5 kg, 1 saco..." required>
        </div>
        <div class="form-group">
          <label for="item-category">Categoria</label>
          <select id="item-category" class="form-control" required>
            <option value="" disabled selected>Selecionar categoria ▼</option>
            <option value="🛒 Mercearia & Alimentos">🛒 Mercearia & Alimentos</option>
            <option value="🧼 Limpeza & Lavanderia">🧼 Limpeza & Lavanderia</option>
            <option value="🪚 Ferramentas & Manutenção">🪚 Ferramentas & Manutenção</option>
            <option value="🌱 Horta, Pomar & Animais">🌱 Horta, Pomar & Animais</option>
            <option value="🪵 Utilidades & Diversos">🪵 Utilidades & Diversos</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">+ ADICIONAR ITEM</button>
      </form>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <span style="font-weight: 700; font-size: 0.9rem;">ITENS NO PEDIDO (<span id="total-count">0</span>)</span>
      <button id="btn-clear-all" class="btn btn-outline" style="width: auto; padding: 6px 12px; font-size: 0.8rem;">🧹 LIMPAR LISTA</button>
    </div>

    <div id="items-container"></div>
  </main>

  <div class="fixed-footer">
    <button id="btn-preview-pdf" class="btn btn-secondary">👁️ PRÉ-VISUALIZAR</button>
    <button id="btn-generate-pdf" class="btn btn-primary">📄 GERAR PDF</button>
  </div>

  <div id="modal-start" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">🌿 Novo Pedido</div>
      <p style="font-size: 0.85rem; color: #555;">Data e hora capturadas automaticamente:</p>
      <p id="modal-datetime" style="font-weight: bold; margin: 6px 0 16px 0; font-size: 1rem;"></p>
      <label style="font-size: 0.85rem; font-weight: 600;">Nível de urgência:</label>
      <div class="urgency-selector">
        <div id="opt-normal" class="urgency-option" onclick="selectUrgency('NORMAL')">🟢 Normal</div>
        <div id="opt-urgente" class="urgency-option" onclick="selectUrgency('URGENTE')">🔴 Urgente</div>
      </div>
      <button id="btn-start-order" class="btn btn-primary" disabled>INICIAR PEDIDO</button>
    </div>
  </div>

  <div id="modal-edit" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">✏️ Editar Item</div>
      <form id="edit-item-form">
        <input type="hidden" id="edit-item-id">
        <div class="form-group">
          <label for="edit-item-name">Nome do item</label>
          <input type="text" id="edit-item-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="edit-item-qty">Quantidade</label>
          <input type="text" id="edit-item-qty" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="edit-item-category">Categoria</label>
          <select id="edit-item-category" class="form-control" required>
            <option value="🛒 Mercearia & Alimentos">🛒 Mercearia & Alimentos</option>
            <option value="🧼 Limpeza & Lavanderia">🧼 Limpeza & Lavanderia</option>
            <option value="🪚 Ferramentas & Manutenção">🪚 Ferramentas & Manutenção</option>
            <option value="🌱 Horta, Pomar & Animais">🌱 Horta, Pomar & Animais</option>
            <option value="🪵 Utilidades & Diversos">🪵 Utilidades & Diversos</option>
          </select>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 16px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modal-edit')">CANCELAR</button>
          <button type="submit" class="btn btn-primary">SALVAR ALTERAÇÕES</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-confirm" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title" id="confirm-title">⚠️ Confirmação</div>
      <p id="confirm-msg" style="margin-bottom: 20px; font-size: 0.9rem; color: #444;"></p>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" onclick="closeModal('modal-confirm')">CANCELAR</button>
        <button id="confirm-action-btn" class="btn btn-danger">CONFIRMAR</button>
      </div>
    </div>
  </div>

  <div id="modal-preview" class="modal-overlay" style="padding: 0;">
    <div style="background: var(--branco); width: 100%; height: 100%; display: flex; flex-direction: column;">
      <div style="padding: 12px; background: var(--verde-escuro); color: white; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: bold; font-size: 0.9rem;">👁️ Pré-visualização A4</span>
        <button onclick="closeModal('modal-preview')" style="background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <div id="a4-preview-container" style="flex: 1; overflow-y: auto;">
        <div id="pdf-render" class="a4-page"></div>
      </div>
      <div style="padding: 12px; background: white; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); display: flex; gap: 8px;">
        <button class="btn btn-secondary" onclick="closeModal('modal-preview')">← VOLTAR</button>
        <button id="btn-preview-generate" class="btn btn-primary">📄 GERAR PDF</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const CATEGORIES = [
      "🛒 Mercearia & Alimentos",
      "🧼 Limpeza & Lavanderia",
      "🪚 Ferramentas & Manutenção",
      "🌱 Horta, Pomar & Animais",
      "🪵 Utilidades & Diversos"
    ];

    let state = {
      datetime: '',
      urgency: '',
      items: []
    };

    let selectedUrgencyTemp = '';

    window.addEventListener('DOMContentLoaded', () => {
      initApp();
      registerSW();
    });

    function registerSW() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
          .then(() => console.log('Service Worker Registrado'))
          .catch((err) => console.error('Erro SW:', err));
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function initApp() {
      const savedData = localStorage.getItem('recanto_limeira_data');
      if (savedData) {
        try {
          state = JSON.parse(savedData);
        } catch (e) {
          state = { datetime: '', urgency: '', items: [] };
        }
      }

      if (!state.datetime || !state.urgency) {
        openStartModal();
      } else {
        updateUI();
      }

      setupEventListeners();
    }

    function saveState() {
      localStorage.setItem('recanto_limeira_data', JSON.stringify(state));
      updateUI();
    }

    function formatDate(d) {
      const pad = (n) => n.toString().padStart(2, '0');
      return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function openStartModal() {
      const now = new Date();
      state.datetime = formatDate(now);
      document.getElementById('modal-datetime').textContent = state.datetime;
      selectedUrgencyTemp = '';
      document.getElementById('opt-normal').className = 'urgency-option';
      document.getElementById('opt-urgente').className = 'urgency-option';
      document.getElementById('btn-start-order').disabled = true;
      openModal('modal-start');
    }

    function selectUrgency(urg) {
      selectedUrgencyTemp = urg;
      document.getElementById('opt-normal').className = 'urgency-option' + (urg === 'NORMAL' ? ' selected-normal' : '');
      document.getElementById('opt-urgente').className = 'urgency-option' + (urg === 'URGENTE' ? ' selected-urgente' : '');
      document.getElementById('btn-start-order').disabled = false;
    }

    function setupEventListeners() {
      document.getElementById('btn-start-order').addEventListener('click', () => {
        state.urgency = selectedUrgencyTemp;
        saveState();
        closeModal('modal-start');
      });

      document.getElementById('add-item-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const nameInput = document.getElementById('item-name');
        const qtyInput = document.getElementById('item-qty');
        const catInput = document.getElementById('item-category');

        const newItem = {
          id: Date.now().toString(),
          name: nameInput.value.trim(),
          qty: qtyInput.value.trim(),
          category: catInput.value
        };

        state.items.push(newItem);
        saveState();

        nameInput.value = '';
        qtyInput.value = '';
        catInput.value = '';
        showToast('Item adicionado!');
      });

      document.getElementById('edit-item-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('edit-item-id').value;
        const name = document.getElementById('edit-item-name').value.trim();
        const qty = document.getElementById('edit-item-qty').value.trim();
        const category = document.getElementById('edit-item-category').value;

        const index = state.items.findIndex(i => i.id === id);
        if (index !== -1) {
          state.items[index] = { id, name, qty, category };
          saveState();
          closeModal('modal-edit');
          showToast('Item atualizado!');
        }
      });

      document.getElementById('btn-clear-all').addEventListener('click', () => {
        if (state.items.length === 0) {
          showToast('A lista já está vazia.');
          return;
        }
        openConfirmModal('⚠️ Limpar toda a lista?', 'Todos os itens serão removidos. Esta ação não pode ser desfeita.', () => {
          state.items = [];
          saveState();
          showToast('Lista limpa!');
        });
      });

      document.getElementById('btn-preview-pdf').addEventListener('click', () => {
        if (state.items.length === 0) {
          showToast('⚠️ Adicione pelo menos um item à lista.');
          return;
        }
        renderPDFTemplate();
        openModal('modal-preview');
      });

      document.getElementById('btn-generate-pdf').addEventListener('click', () => {
        executePDFDownload();
      });

      document.getElementById('btn-preview-generate').addEventListener('click', () => {
        executePDFDownload();
      });
    }

    function updateUI() {
      document.getElementById('display-datetime').textContent = `📅 ${state.datetime || '--/--/---- --:--'}`;
      const urgEl = document.getElementById('display-urgency');
      if (state.urgency === 'URGENTE') {
        urgEl.textContent = '🔴 URGENTE';
        urgEl.className = 'badge-urgencia badge-urgente';
      } else {
        urgEl.textContent = '🟢 NORMAL';
        urgEl.className = 'badge-urgencia badge-normal';
      }

      document.getElementById('total-count').textContent = state.items.length;
      const container = document.getElementById('items-container');
      container.innerHTML = '';

      if (state.items.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px 10px; color: #78909C;">
            <p style="font-size: 2rem; margin-bottom: 8px;">🧺</p>
            <p style="font-size: 0.95rem; font-weight: 600;">Sua lista está vazia</p>
            <p style="font-size: 0.8rem; margin-top: 4px;">Adicione itens pelo formulário acima.</p>
          </div>
        `;
        return;
      }

      CATEGORIES.forEach(cat => {
        const catItems = state.items.filter(item => item.category === cat);
        if (catItems.length > 0) {
          const catDiv = document.createElement('div');
          catDiv.className = 'category-group';
          
          let itemsHTML = '';
          catItems.forEach(item => {
            itemsHTML += `
              <div class="item-card">
                <div class="item-info">
                  <div class="item-name">${escapeHTML(item.name)}</div>
                  <div class="item-qty">${escapeHTML(item.qty)}</div>
                </div>
                <div class="item-actions">
                  <button class="action-btn" onclick="openEditModal('${item.id}')" aria-label="Editar">✏️</button>
                  <button class="action-btn" onclick="confirmDeleteItem('${item.id}')" aria-label="Excluir">🗑️</button>
                </div>
              </div>
            `;
          });

          catDiv.innerHTML = `
            <div class="category-title">${cat} (${catItems.length})</div>
            ${itemsHTML}
          `;
          container.appendChild(catDiv);
        }
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function openEditModal(id) {
      const item = state.items.find(i => i.id === id);
      if (!item) return;
      document.getElementById('edit-item-id').value = item.id;
      document.getElementById('edit-item-name').value = item.name;
      document.getElementById('edit-item-qty').value = item.qty;
      document.getElementById('edit-item-category').value = item.category;
      openModal('modal-edit');
    }

    function confirmDeleteItem(id) {
      const item = state.items.find(i => i.id === id);
      if (!item) return;
      openConfirmModal(
        '⚠️ Excluir item?',
        `Deseja realmente excluir:\n\n"${item.name}"\n\nEsta ação não pode ser desfeita.`,
        () => {
          state.items = state.items.filter(i => i.id !== id);
          saveState();
          showToast('Item removido!');
        }
      );
    }

    function openConfirmModal(title, msg, onConfirm) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-msg').innerText = msg;
      const btn = document.getElementById('confirm-action-btn');
      
      const newBtn = btn.cloneNode(true);
      btn.parentNode.replaceChild(newBtn, btn);
      
      newBtn.addEventListener('click', () => {
        onConfirm();
        closeModal('modal-confirm');
      });
      openModal('modal-confirm');
    }

    function renderPDFTemplate() {
      const target = document.getElementById('pdf-render');
      let categoriesHTML = '';

      CATEGORIES.forEach(cat => {
        const catItems = state.items.filter(i => i.category === cat);
        if (catItems.length > 0) {
          let rowsHTML = '';
          catItems.forEach(item => {
            rowsHTML += `
              <tr>
                <td style="width: 70%;">${escapeHTML(item.name)}</td>
                <td style="width: 30%; font-weight: bold;">${escapeHTML(item.qty)}</td>
              </tr>
            `;
          });

          categoriesHTML += `
            <div class="pdf-category">
              <div class="pdf-category-title">${cat}</div>
              <table class="pdf-table">
                <thead>
                  <tr>
                    <th>Produto / Suprimento</th>
                    <th>Quantidade</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHTML}
                </tbody>
              </table>
            </div>
          `;
        }
      });

      const isUrgente = state.urgency === 'URGENTE';
      const statusStyle = isUrgente ? 'color: #C62828; font-weight: bold;' : 'color: #2E7D32; font-weight: bold;';

      target.innerHTML = `
        <div class="pdf-header">
          <h2>SÍTIO RECANTO DA LIMEIRA</h2>
          <p>Controle de Suprimentos e Compras</p>
          <div class="pdf-meta">
            <span>Data/Hora: ${state.datetime}</span>
            <span>STATUS: <span style="${statusStyle}">${state.urgency}</span></span>
          </div>
        </div>
        <div>
          ${categoriesHTML}
        </div>
        <div class="pdf-footer">
          Sítio Recanto da Limeira — Pedido de Suprimentos
        </div>
      `;
    }

    function executePDFDownload() {
      if (state.items.length === 0) {
        showToast('⚠️ Adicione pelo menos um item à lista.');
        return;
      }

      renderPDFTemplate();
      const element = document.getElementById('pdf-render');
      showToast('Gerando PDF, aguarde...');

      const opt = {
        margin: [10, 10, 10, 10],
        filename: 'Pedido_Suprimentos_Recanto_da_Limeira.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'] }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        showToast('PDF gerado com sucesso!');
        closeModal('modal-preview');
      }).catch(err => {
        console.error(err);
        showToast('Erro ao gerar PDF.');
      });
    }
  </script>
</body>
</html>
