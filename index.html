<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sítio Recanto da Limeira - Controle de Suprimentos</title>
<meta name="theme-color" content="#1b5e20">
<link id="favicon" rel="icon" href="">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--verde:#1b5e20;--verde-claro:#e8f5e9;--borda:#c8e6c9}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6faf6}
header{background:#1b5e20;color:#fff;padding:14px 16px;position:sticky;top:0;display:flex;gap:12px;align-items:center}
.card{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:14px;margin:12px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.row{display:flex;gap:8px;flex-wrap:wrap} input,select{padding:11px;border:1px solid #cbd5cb;border-radius:10px;flex:1}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}
.btn-primary{background:#1b5e20;color:#fff}.btn-ghost{background:#e8f5e9;color:#1b5e20}
.item{display:flex;justify-content:space-between;padding:10px;border:1px solid #e0e0e0;border-radius:12px;margin-bottom:6px}
</style>
</head>
<body>
<header><div id="logoTxt">SL</div><div><b>SÍTIO RECANTO DA LIMEIRA</b><br><small>Controle de Suprimentos • PWA Offline</small></div><button id="btnInstall" style="display:none;margin-left:auto">📲 Instalar</button></header>
<main>
<div class="card">
<div class="row"><input id="inpProduto" placeholder="Produto"><input id="inpQtd" type="number" value="1" style="max-width:80px"><select id="inpStatus"><option>NORMAL</option><option>URGENTE</option><option>CRÍTICO</option></select><button class="btn btn-primary" id="btnAdd">+ Add</button></div>
<div class="row" style="margin-top:8px"><input id="busca" placeholder="🔎 Buscar"><button class="btn btn-ghost" id="btnModelo">Modelo PDF</button><button class="btn btn-ghost" id="btnLimpar">Limpar</button></div>
<small>Data: <span id="dtAgora"></span> • Itens: <span id="totalItens"></span></small>
</div>
<div class="card"><div id="lista"></div></div>
<div class="card"><button class="btn btn-primary" id="btnPDF">📄 GERAR PDF ELABORADO</button> <button class="btn btn-ghost" id="btnWhats">WhatsApp</button></div>
</main>
<script>
// ÍCONE GERADO (corrige ícone Google)
function genIcon(s){const c=document.createElement('canvas');c.width=s;c.height=s;const x=c.getContext('2d');x.fillStyle='#1b5e20';x.fillRect(0,0,s,s);x.fillStyle='#fff';x.beginPath();x.arc(s/2,s/2,s*0.38,0,7);x.fill();x.fillStyle='#81c784';x.beginPath();x.arc(s/2,s/2,s*0.32,0,7);x.fill();x.fillStyle='#1b5e20';x.font=`bold ${s*0.22}px Arial`;x.textAlign='center';x.textBaseline='middle';x.fillText('SL',s/2,s/2);return c.toDataURL()}
const i192=genIcon(192),i512=genIcon(512);document.getElementById('favicon').href=i192;
const manifest={name:"Sítio Recanto da Limeira",short_name:"Recanto Limeira",start_url:".",display:"standalone",background_color:"#1b5e20",theme_color:"#1b5e20",icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(mBlob);document.head.appendChild(link);
let aLink=document.createElement('link');aLink.rel='apple-touch-icon';aLink.href=i192;document.head.appendChild(aLink);

// DADOS DO SEU PDF
const modelo=[["Ração cachorro tufão 25kl",1],["Gás cozinha",2],["Algicida manutenção",3],["Algicida de choque",3],["Pastilhas de cloro",6],["Cloro Balde",1],["Sacos de lixo 100L",1],["Detergente",5],["Sabão barra",1],["Sabão em pó",1],["Veneno de rato pastilhas",2],["Veneno formiga",10],["Flutuador de pastilhas de cloro",2],["Carretel nylon roçadeira",1],["Desenfetante 5L",1],["Limpa pedra 5l",1],["Elevador de PH",4],["Esponja de aço (Bombril)",2],["Esponja louças kit 4 uni",1],["Fósforo caixinha maço",1],["Aromatizador ambiente",1],["Rodo de passar pano medio",1],["Papel Higiênico",1],["Elevador de alcalinidade",3]];
let itens=JSON.parse(localStorage.getItem('limeira_itens')||'null')||modelo.map((m,i)=>({id:Date.now()+i,nome:m[0],qtd:m[1]}));
let statusCompra=localStorage.getItem('limeira_status')||'NORMAL';
function save(){localStorage.setItem('limeira_itens',JSON.stringify(itens));localStorage.setItem('limeira_status',statusCompra);render()}
function render(){document.getElementById('totalItens').textContent=itens.length;document.getElementById('dtAgora').textContent=new Date().toLocaleString('pt-BR');const b=(document.getElementById('busca').value||'').toLowerCase();const l=document.getElementById('lista');l.innerHTML='';itens.filter(it=>!b||it.nome.toLowerCase().includes(b)).forEach(it=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<b>${it.nome}</b><span><button onclick="altQtd(${it.id},-1)">-</button> ${it.qtd} <button onclick="altQtd(${it.id},1)">+</button> <button onclick="rem(${it.id})">✕</button></span>`;l.appendChild(d)})}
window.altQtd=(id,d)=>{const it=itens.find(x=>x.id===id);it.qtd=Math.max(1,it.qtd+d);save()};window.rem=id=>{itens=itens.filter(x=>x.id!==id);save()};
document.getElementById('btnAdd').onclick=()=>{const n=document.getElementById('inpProduto').value.trim();if(!n)return;itens.push({id:Date.now(),nome:n,qtd:parseInt(document.getElementById('inpQtd').value)||1});save();document.getElementById('inpProduto').value=''};
document.getElementById('btnLimpar').onclick=()=>{if(confirm('Limpar?')){itens=[];save()}};document.getElementById('btnModelo').onclick=()=>{itens=modelo.map((m,i)=>({id:Date.now()+i,nome:m[0],qtd:m[1]}));save()};
document.getElementById('busca').oninput=render;document.getElementById('inpStatus').onchange=e=>{statusCompra=e.target.value;save()};

function gerarPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});const W=doc.internal.pageSize.getWidth();doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(27,94,32);doc.text('SÍTIO RECANTO DA LIMEIRA',W/2,38,{align:'center'});doc.setFontSize(11);doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.text('Controle de Suprimentos e Compras',W/2,54,{align:'center'});doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(27,94,32);doc.text(`Data/Hora: ${new Date().toLocaleString('pt-BR')}`,40,78);doc.text(`Status: ${statusCompra}`,W-40,78,{align:'right'});doc.setDrawColor(27,94,32);doc.line(40,84,W-40,84);doc.autoTable({startY:92,head:[['Produto / Suprimento','Quantidade']],body:itens.map(i=>[i.nome,i.qtd.toString()]),headStyles:{fillColor:[232,245,233],textColor:[27,94,32]},columnStyles:{1:{halign:'center',fontStyle:'bold',cellWidth:80}},margin:{left:40,right:40}});return doc}
document.getElementById('btnPDF').onclick=()=>{gerarPDF().save(`Recanto_Limeira_${new Date().toISOString().slice(0,10)}.pdf`)};
document.getElementById('btnWhats').onclick=()=>{const t=itens.map(i=>`• ${i.nome} - ${i.qtd}`).join('\n');window.open(`https://wa.me/?text=${encodeURIComponent(`*SÍTIO RECANTO DA LIMEIRA*\n${t}`)}`)};

// PWA OFFLINE
const sw=`const C='limeira-v3';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['.'])).then(()=>self.skipWaiting()))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(e.request.url.includes('cdnjs'))caches.open(C).then(c=>c.put(e.request,res.clone()));return res})).catch(()=>caches.match('.')))});`;
const swB=new Blob([sw],{type:'text/javascript'});if('serviceWorker' in navigator)navigator.serviceWorker.register(URL.createObjectURL(swB));
let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('btnInstall').style.display='block'});document.getElementById('btnInstall').onclick=async()=>{dp.prompt();await dp.userChoice;dp=null};
render();
</script>
</body>
</html>
